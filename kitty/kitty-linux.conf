# Linux/desktop overrides — include the base macOS config then override below
include ~/.dotfiles/kitty/kitty.conf

# Linux has no cmd key
kitty_mod ctrl+shift

# Unmap macOS-specific no_ops (harmless on Linux but cmd+ keys don't exist anyway)
map shift+cmd+d no_op

# Disable macOS window management bindings
map cmd+w no_op
map cmd+] no_op
map cmd+[ no_op
map cmd+t no_op
map cmd+enter no_op
map kitty_mod+n no_op

# No background opacity on Linux/Hyprland (compositor handles transparency if needed)
background_opacity 1.0

# Tab navigation with ctrl+shift since we don't have cmd+
map kitty_mod+t new_tab !neighbor
map kitty_mod+] next_tab
map kitty_mod+[ previous_tab

# Hyprland handles window management; only keep what kitty needs to do
# map kitty_mod+w close_window
# map kitty_mod+] next_window
# map kitty_mod+[ previous_window

# Window splits (Hyprland handles most of this, but kitty splits still useful)
map kitty_mod+v launch --location=vsplit
map kitty_mod+h launch --location=hsplit
